name: car_privacy_shield
description: تطبيق لحماية خصوصية أصحاب السيارات وتوليد ملصقات QR للتنبيه السريع
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Firebase Core & Services
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: ^18.0.1
  cloud_functions: ^5.2.0

  # QR Code Generation & Scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3

  # UI, Icons & Image Exporting
  lucide_icons: ^0.257.0
  screenshot: ^3.0.0
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  image_gallery_saver_plus: ^3.0.5
  intl: ^0.19.0
  uuid: ^4.5.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
    - assets/images/